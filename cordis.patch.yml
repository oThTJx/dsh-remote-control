# Installable overlay patch for `@firefly0621/dsh-remote-control`.
# Opt-in: not mounted by default on fork `dsh-base`. Prefer:
#   dsh plugin --profile web add @firefly0621/dsh-remote-control
# Configure relayUrl/deviceId/deviceSecret in the profile's cordis.patch.yml:
#   - update:
#       - id: remote-control
#         config:
#           relayUrl: wss://relay.example.com
#           deviceId: my-pc
#           deviceSecret: <the secret you registered on the relay>
- insert:
    - id: remote-control
      name: '@firefly0621/dsh-remote-control'
    # The browser half is this plugin's own dsh.client roster row: the web-app
    # bundle deliberately does not declare it, so this bundle is the single
    # source for the pairing tab on every web-app version.
    - id: ui-remote-control
      name: '@firefly0621/dsh-client-ui-remote-control'
